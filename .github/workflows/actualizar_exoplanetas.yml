name: Actualizar catálogo de exoplanetas

on:
  # Una vez al día. GitHub Actions usa UTC para cron.
  schedule:
    - cron: "0 8 * * *"

  # Permite ejecutarlo manualmente desde GitHub -> Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-exoplanetas
  cancel-in-progress: false

jobs:
  actualizar-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar catálogo actualizado desde NASA
        run: python src/actualizar_exoplanetas.py

      - name: Comprobar si cambió el CSV
        id: cambios
        shell: bash
        run: |
          if git diff --quiet -- src/exoplanets_ps_default.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "El catálogo no cambió."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron cambios en el catálogo."
          fi

      - name: Guardar actualización en GitHub
        if: steps.cambios.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/exoplanets_ps_default.csv
          git commit -m "chore: actualizar catálogo de exoplanetas"
          git push
